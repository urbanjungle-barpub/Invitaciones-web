<style>
  :root{
    --verde-950:#0a1f14;
    --verde-900:#0f2a1c;
    --verde-800:#123521;
    --verde-700:#184a2c;
    --borde:#2f6b45;
    --dorado:#e8c547;
    --dorado-2:#f2d566;
    --texto:#eaf3ec;
    --texto-sec:#9cb8a6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(circle at 50% 0%, var(--verde-800) 0%, var(--verde-950) 60%),
      linear-gradient(160deg,#08160e 0%, #0d2015 100%);
    color:var(--texto);
  }

  .card{
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, var(--verde-900), var(--verde-950));
    border:1px solid var(--borde);
    border-radius:22px;
    padding:34px 28px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 20% -10%, rgba(232,197,71,.08), transparent 55%);
    pointer-events:none;
  }

  .logo-wrap{ text-align:center; margin-bottom:2px; }
  .logo-img{
    width:78%;
    max-width:300px;
    height:auto;
    display:inline-block;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));
  }
  .evento-sub{
    text-align:center;
    font-size:14px;
    color:var(--texto-sec);
    margin:8px 0 22px;
  }
  .evento-sub b{ color:var(--dorado); }

  form{ display:flex; flex-direction:column; gap:14px; }

  input{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--borde);
    background:rgba(255,255,255,.03);
    color:var(--texto);
    font-size:15px;
    outline:none;
    transition:border-color .15s, background .15s;
  }
  input::placeholder{ color:#7fa088; }
  input:focus{
    border-color:var(--dorado);
    background:rgba(255,255,255,.05);
  }

  button{
    margin-top:6px;
    width:100%;
    padding:15px 16px;
    border:none;
    border-radius:12px;
    background:linear-gradient(180deg, var(--dorado-2), var(--dorado));
    color:#1a1405;
    font-size:15px;
    font-weight:700;
    letter-spacing:.5px;
    cursor:pointer;
    transition:transform .1s, box-shadow .15s, opacity .15s;
    box-shadow:0 8px 20px rgba(232,197,71,.18);
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 10px 26px rgba(232,197,71,.28); }
  button:active{ transform:translateY(0); }
  button:disabled{ opacity:.6; cursor:default; transform:none; }

  .error{
    color:#ff8a8a;
    font-size:12.5px;
    text-align:center;
    min-height:16px;
    margin-top:2px;
  }

  /* ---- Pantalla de éxito ---- */
  .success{
    display:none;
    text-align:center;
  }
  .success .check{
    width:64px;height:64px;
    margin:0 auto 16px;
    border-radius:50%;
    background:rgba(232,197,71,.12);
    border:1px solid var(--dorado);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;
  }
  .success h2{
    margin:0 0 14px;
    font-size:19px;
    color:var(--dorado-2);
  }
  .success p{
    font-size:14.5px;
    line-height:1.7;
    color:var(--texto);
    white-space:pre-line;
    margin:0 0 22px;
  }
  .success .tag{
    color:var(--dorado);
    font-weight:700;
  }
  .success .btns{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .success button.secondary{
    background:transparent;
    color:var(--texto);
    border:1px solid var(--borde);
    box-shadow:none;
  }

  .preview-img{
    width:100%;
    border-radius:14px;
    margin-bottom:18px;
    border:1px solid var(--borde);
    display:block;
  }

  .hidden{ display:none !important; }

  canvas{ display:none; }
</style>
</head>

function wrapAndFitText(context, text, maxWidth, maxHeight, startSize) {
  // Reduce el tamaño de fuente hasta que el texto entre en una sola línea
  let size = startSize;
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  do {
    context.font = `700 ${size}px 'Arial Black', Arial, sans-serif`;
    const w = context.measureText(text).width;
    if (w <= maxWidth || size <= 14) break;
    size -= 2;
  } while (true);
  return size;
}

function generarImagen(nombre) {
  return new Promise((resolve) => {
    const draw = () => {
      canvas.width = baseImage.naturalWidth;
      canvas.height = baseImage.naturalHeight;
      ctx.drawImage(baseImage, 0, 0);

      const cx = BOX.x + BOX.width / 2;
      const cy = BOX.y + BOX.height / 2;

      const fontSize = wrapAndFitText(ctx, nombre.toUpperCase(), BOX.width - 24, BOX.height, 48);
      ctx.font = `700 ${fontSize}px 'Arial Black', Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Sombra suave para legibilidad sobre el naranja
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = '#1a1405';
      ctx.fillText(nombre.toUpperCase(), cx, cy);
      ctx.shadowColor = 'transparent';

      const dataUrl = canvas.toDataURL('image/png');
      resolve(dataUrl);
    };

    if (baseImage.complete && baseImage.naturalWidth > 0) {
      draw();
    } else {
      baseImage.onload = draw;
    }
  });
}

function descargarImagen(dataUrl, fileName) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

async function enviarAGoogleSheets(nombre, telefono) {
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('PEGA_AQUI')) {
    console.warn('GOOGLE_SCRIPT_URL no configurada: el registro no se envió a la planilla.');
    return;
  }
  const body = new URLSearchParams({ nombre, telefono, fecha: new Date().toISOString() });
  try {
    // no-cors: no podemos leer la respuesta, pero el POST se envía igual
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body
    });
  } catch (err) {
    console.error('Error enviando a Google Sheets:', err);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.textContent = '';

  const nombre = document.getElementById('nombre').value.trim();
  const telefono = document.getElementById('telefono').value.trim();

  if (!nombre || !telefono) {
    errorMsg.textContent = 'Completá tu nombre y teléfono para continuar.';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Generando...';

  try {
    const [dataUrl] = await Promise.all([
      generarImagen(nombre),
      enviarAGoogleSheets(nombre, telefono)
    ]);

    lastDataUrl = dataUrl;
    lastFileName = `invitacion_${nombre.replace(/\s+/g, '_').toLowerCase()}.png`;

    previewImg.src = dataUrl;
    descargarImagen(dataUrl, lastFileName);

    formScreen.style.display = 'none';
    successScreen.style.display = 'block';
  } catch (err) {
    console.error(err);
    errorMsg.textContent = 'Ocurrió un error generando tu invitación. Probá de nuevo.';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Ingresar';
  }
});

document.getElementById('downloadAgainBtn').addEventListener('click', () => {
  if (lastDataUrl) descargarImagen(lastDataUrl, lastFileName);
});

document.getElementById('restartBtn').addEventListener('click', () => {
  form.reset();
  successScreen.style.display = 'none';
  formScreen.style.display = 'block';
});
</script>
